<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#FF6B35" stroke="#FFB84D" stroke-width="2"/>
  
  <!-- House Icon -->
  <g transform="translate(50, 50)">
    <!-- Roof -->
    <path d="M -25 -5 L 0 -25 L 25 -5 Z" fill="#FFFFFF"/>
    
    <!-- House Body -->
    <rect x="-20" y="-5" width="40" height="30" fill="#FFFFFF"/>
    
    <!-- Door -->
    <rect x="-8" y="10" width="16" height="15" fill="#FF6B35"/>
    
    <!-- Windows -->
    <rect x="-16" y="2" width="10" height="10" fill="#FFB84D"/>
    <rect x="6" y="2" width="10" height="10" fill="#FFB84D"/>
  </g>
</svg>
